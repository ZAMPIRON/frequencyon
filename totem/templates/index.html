<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FrequencyON - Chamada Escolar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 1.8rem; color: #00e676; }
        .header p { font-size: 0.9rem; color: #aaa; }
        .video-wrapper { position: relative; width: 100%; max-width: 480px; aspect-ratio: 4/3; background: #000; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 2px solid #333; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .card-status { width: 100%; max-width: 480px; margin-top: 20px; padding: 18px; border-radius: 12px; font-size: 1.2rem; font-weight: bold; text-align: center; transition: all 0.3s ease; background: #1e1e1e; border: 1px solid #333; }
        .searching { color: #888; border-color: #333; }
        .success { color: #00ff7f; background: rgba(0, 255, 127, 0.1); border-color: #00ff7f; }
        .warning { color: #ffca28; background: rgba(255, 202, 40, 0.1); border-color: #ffca28; }
        .error { color: #ff5252; background: rgba(255, 82, 82, 0.1); border-color: #ff5252; }
    </style>
</head>
<body>

    <div class="header">
        <h1>FrequencyON</h1>
        <p>Leitor Facial de Presença</p>
    </div>

    <div class="video-wrapper">
        <!-- 'playsinline' e 'muted' são OBRIGATÓRIOS para a câmera funcionar no iPhone/iOS -->
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="canvas" style="display: none;"></canvas>
    </div>

    <div id="statusCard" class="card-status searching">
        Aguardando permissão da câmera...
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const statusCard = document.getElementById('statusCard');
        let isProcessing = false;

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                statusCard.className = "card-status searching";
                statusCard.innerText = "🔍 Posicione o rosto na câmera...";
                
                // Inicia o envio constante de quadros a cada 250ms
                setInterval(sendFrameToBackend, 250);
            } catch (err) {
                console.error("Erro ao acessar câmera:", err);
                statusCard.className = "card-status error";
                statusCard.innerText = "❌ Câmera bloqueada ou indisponível.";
            }
        }

        async function sendFrameToBackend() {
            if (isProcessing || video.readyState !== 4) return;
            isProcessing = true;

            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const base64Image = canvas.toDataURL('image/jpeg', 0.6);

            try {
                const response = await fetch('/api/process_frame', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image })
                });

                if (response.ok) {
                    const data = await response.json();

                    if (data.recognized) {
                        if (data.status === "registrado") {
                            statusCard.className = "card-status success";
                            statusCard.innerText = `✅ Presença Confirmada: ${data.aluno_nome}`;
                        } else {
                            statusCard.className = "card-status warning";
                            statusCard.innerText = `⏰ ${data.aluno_nome} (Já registrado)`;
                        }
                    } else {
                        statusCard.className = "card-status searching";
                        statusCard.innerText = "🔍 Procurando rostos...";
                    }
                }
            } catch (err) {
                console.error("Erro na requisição:", err);
            } finally {
                isProcessing = false;
            }
        }

        window.addEventListener("DOMContentLoaded", initCamera);
    </script>
</body>
</html>
