<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FrequencyON - Painel Administrativo{% endblock %}</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --sidebar-bg: #1a2035;
            --sidebar-active: #242c44;
            --main-bg: #f8fafc;
        }
        body {
            background-color: var(--main-bg);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
        }
        .sidebar .nav-link {
            color: #94a3b8;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        .sidebar .nav-link:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.05);
        }
        .sidebar .nav-link.active {
            color: #ffffff;
            background-color: var(--sidebar-active);
        }
        .topbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
        }
        .search-input {
            background-color: #f1f5f9;
            border: 1px solid transparent;
            font-size: 0.8125rem;
            padding-left: 2.25rem;
        }
        .search-input:focus {
            background-color: #ffffff;
            border-color: #0d6efd;
            box-shadow: none;
        }
        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.8125rem;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="vh-100 overflow-hidden">

    <div class="d-flex h-100">
        <!-- Sidebar Lateral -->
        <aside class="sidebar d-flex flex-column justify-content-between p-3 flex-shrink-0 text-white">
            <div>
                <!-- Logo -->
                <div class="d-flex align-items-center mb-4 px-2 pt-2">
                    <div class="bg-primary text-white rounded-3 d-flex align-items-center justify-content-center me-3" style="width: 38px; height: 38px;">
                        <i class="fa-solid fa-file-lines fs-5"></i>
                    </div>
                    <div>
                        <h1 class="h6 fw-bold mb-0 text-white">
                            Frequency<span class="text-success">ON</span>
                        </h1>
                        <small class="text-secondary text-uppercase font-monospace" style="font-size: 9px; letter-spacing: 0.5px;">
                            Controle de Presença
                        </small>
                    </div>
                </div>

                <!-- Menu de Navegação -->
                <nav class="nav nav-pills flex-column gap-1">
                    <a href="/" class="nav-link active d-flex align-items-center gap-3">
                        <i class="fa-solid fa-border-all text-center" style="width: 20px;"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="{{ url_for('alunos') }}" class="nav-link d-flex align-items-center gap-3">
                        <i class="fa-solid fa-user-group text-center" style="width: 20px;"></i>
                        <span>Alunos</span>
                    </a>
                    <a href="{{ url_for('professores') }}" class="nav-link d-flex align-items-center gap-3">
                        <i class="fa-solid fa-briefcase text-center" style="width: 20px;"></i>
                        <span>Professores</span>
                    </a>
                    <a href="{{ url_for('turmas') }}" class="nav-link d-flex align-items-center gap-3">
                        <i class="fa-solid fa-book-open text-center" style="width: 20px;"></i>
                        <span>Turmas</span>
                    </a>
                    <a href="{{ url_for('relatorios') }}" class="nav-link d-flex align-items-center gap-3">
                        <i class="fa-solid fa-chart-simple text-center" style="width: 20px;"></i>
                        <span>Relatórios</span>
                    </a>
                </nav>
            </div>

            <!-- Perfil Rodapé Sidebar -->
            <div class="pt-3 border-top border-secondary border-opacity-25 d-flex align-items-center gap-3">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" 
                     alt="Usuário" class="rounded-circle object-fit-cover" style="width: 32px; height: 32px;">
                <div class="overflow-hidden">
                    <p class="mb-0 text-white-50 small text-truncate">...</p>
                </div>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <div class="flex-grow-1 d-flex flex-column h-100 overflow-y-auto">
            <!-- Topbar / Header -->
            <header class="topbar px-4 py-3 d-flex align-items-center justify-between sticky-top z-3">
                <div>
                    <h2 class="h5 fw-bold text-dark mb-0">Painel Administrativo</h2>
                    <small class="text-muted fw-semibold">Instituto Federal de Educação</small>
                </div>

                <div class="d-flex align-items-center gap-4">
                    <!-- Barra de Busca -->
                    <div class="position-relative" style="width: 260px;">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" class="form-control rounded-3 search-input" placeholder="Buscar alunos, turmas...">
                    </div>

                    <!-- Data -->
                    <div class="d-flex align-items-center gap-2 text-secondary small border-end pe-4">
                        <i class="fa-regular fa-calendar"></i>
                        <span>Seg, 15 de Outubro</span>
                    </div>

                    <!-- Avatar Menu -->
                    <div class="d-flex align-items-center gap-2" style="cursor: pointer;">
                        <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=100&auto=format&fit=crop&q=80" 
                             alt="Usuário Logado" class="rounded-circle border object-fit-cover" style="width: 34px; height: 34px;">
                        <i class="fa-solid fa-chevron-down text-muted" style="font-size: 10px;"></i>
                    </div>
                </div>
            </header>

            <!-- Conteúdo Dinâmico das Páginas -->
            <main class="p-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script para Ativar/Destacar o Item do Menu Lateral -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const navLinks = document.querySelectorAll('.sidebar .nav-link');
            const currentPath = window.location.pathname;

            navLinks.forEach(link => {
                const linkHref = link.getAttribute('href');

                // 1. Marca como 'active' o link que corresponde à URL atual
                if (linkHref && currentPath.includes(linkHref) && linkHref !== '#') {
                    navLinks.forEach(item => item.classList.remove('active'));
                    link.classList.add('active');
                }

                // 2. Evento de clique para trocar a cor instantaneamente
                link.addEventListener('click', function () {
                    navLinks.forEach(item => item.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
</body>
</html>
