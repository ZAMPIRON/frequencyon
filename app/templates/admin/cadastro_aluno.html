{% extends 'admin/base.html' %}

{% block title %}Novo Aluno - FrequencyOn{% endblock %}

{% block content %}
<div class="mb-4">
    <h1 class="h4 fw-bold text-dark mb-1">Cadastrar Aluno</h1>
    <p class="text-muted mb-0 small">Insira os dados do novo estudante</p>
</div>

<div class="card border-0 shadow-sm rounded-3">
    <div class="card-body p-4">
        <!-- O enctype é obrigatório para envio de arquivos -->
        <form method="POST" action="{{ url_for('novo_aluno') }}" enctype="multipart/form-data">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Nome Completo</label>
                    <input type="text" name="nome" class="form-control" required placeholder="Ex: João da Silva">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold">Matrícula</label>
                    <input type="text" name="matricula" class="form-control" required placeholder="Ex: 2024001">
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-bold">Nº Chamada</label>
                    <input type="number" min="1" name="numero_chamada" class="form-control" placeholder="Ex: 12">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold">E-mail</label>
                    <input type="email" name="email" class="form-control" placeholder="aluno@instituto.edu.br">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Foto do Aluno</label>
                    <input type="file" name="foto" class="form-control" accept="image/*">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Turma</label>
                    <select name="turma_id" class="form-select">
                        <option value="">Selecione...</option>
                        {% for turma in turmas %}
                        <option value="{{ turma.id }}">{{ turma.nome }} ({{ turma.curso }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Frequência Inicial (%)</label>
                    <input type="number" step="0.1" min="0" max="100" name="frequencia" class="form-control" value="100.0">
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="{{ url_for('alunos') }}" class="btn btn-light btn-sm fw-semibold">Cancelar</a>
                <button type="submit" class="btn btn-primary btn-sm fw-semibold px-4">Salvar Aluno</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
