<!-- Seletor de Turmas cadastradas pelo Admin -->
<div class="d-flex align-items-center justify-content-between mb-3">
  <h4 class="fw-bold mb-0">Chamada do Dia</h4>
  <form method="GET" action="{{ url_for('professor.chamada') }}" class="d-flex gap-2">
    <select name="turma_id" class="form-select form-select-sm" onchange="this.form.submit()">
      {% for turma in turmas %}
        <option value="{{ turma.id }}" {% if turma_selecionada and turma.id == turma_selecionada.id %}selected{% endif %}>
          {{ turma.nome }} - {{ turma.curso }}
        </option>
      {% endfor %}
    </select>
  </form>
</div>

<!-- Tabela de Alunos -->
<table class="table table-hover align-middle mb-0">
  <thead class="table-light text-uppercase text-secondary small">
    <tr>
      <th class="ps-4">Nome</th>
      <th class="d-none d-sm-table-cell">Matrícula</th>
      <th>Data</th>
      <th>Status (10 Aulas)</th>
    </tr>
  </thead>
  <tbody>
    {% for aluno in alunos %}
    <tr>
      <td class="ps-4">
        <div class="d-flex align-items-center gap-3">
          <div class="avatar">{{ aluno.iniciais }}</div>
          <span class="fw-medium">{{ aluno.nome }}</span>
        </div>
      </td>
      <td class="d-none d-sm-table-cell text-muted small">{{ aluno.matricula }}</td>
      <td class="text-muted small">{{ aluno.data }}</td>
      <td>
        <div class="d-flex gap-1">
          {% for estado in aluno.status %}
            <div class="bar {{ 'on' if estado == 'presente' else ('late' if estado == 'atraso' else 'off') }}"
                 data-aluno="{{ aluno.id }}"
                 data-barra="{{ loop.index0 }}"
                 onclick="registrarClique(this)"></div>
          {% endfor %}
        </div>
      </td>
    </tr>
    {% else %}
    <tr>
      <td colspan="4" class="text-center text-muted py-4">Nenhum aluno cadastrado nesta turma.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
